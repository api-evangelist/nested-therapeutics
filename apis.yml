aid: nested-therapeutics
name: Nested Therapeutics
description: 'Nested Therapeutics is a clinical-stage biotechnology company founded in 2021 and headquartered
  at 1030 Massachusetts Avenue in Cambridge, Massachusetts. It discovers and develops novel, targeted,
  small-molecule precision medicines for patients with cancers driven by the RAS-MAPK pathway, using
  mutation clusters to identify druggable pockets that conventional target discovery misses. Its lead
  program, NST-628, is a pan-RAF/MEK non-degrading molecular glue cleared by the FDA for investigation in
  advanced solid tumors carrying RAS-MAPK genetic alterations. The company was launched with $125 million
  in financing from Versant Ventures and the life sciences investment division of Goldman Sachs Asset
  Management. Nested Therapeutics is a therapeutics developer, not a software vendor: it publishes a
  two-page marketing website and press-release PDFs, and operates no public API, developer portal, SDK
  or machine-readable contract of any kind.'
